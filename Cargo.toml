[workspace]
resolver = "3"
members = ["crates/discord", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.1.0"
publish = false

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_24"] }
glib = "0.22"
gio = "0.22"
soup = { package = "soup3", version = "0.9" }
libsecret = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

# Keep target/ small: line tables are enough for readable backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
