[workspace]
resolver = "3"
members = ["crates/discord", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
version = "0.1.0"
publish = false

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_24"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
glib = "0.22"
gio = "0.22"
soup = { package = "soup3", version = "0.9" }
libsecret = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
openssl = "0.10"
qrcodegen = "1.8"
webkit = { package = "webkit6", version = "0.6" }
sourceview = { package = "sourceview5", version = "0.11" }

# Keep target/ small: line tables are enough for readable backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
