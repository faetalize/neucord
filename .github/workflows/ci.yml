name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    # Neucord needs GTK 4.24 or newer, which Ubuntu does not ship yet.
    container: archlinux:latest
    steps:
      # libheif is glycin's optional HEIC loader; the image tests need it.
      # gst-plugins-base is GStreamer's plugins, not just its libraries: the
      # video stats test makes and reads an Ogg clip with them.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita libsoup3 webkitgtk-6.0 gtksourceview5 libspelling gst-plugins-base-libs gst-plugins-base libsecret openssl libheif
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
